name: Voice MMS Tagalog Benchmark

on:
  push:
    branches:
      - main
    paths:
      - tools/voice/mms_tagalog_benchmark.py
      - .github/workflows/voice-mms-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-mms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch>=2.5,<3" \
            "transformers>=4.33,<5" \
            "scipy>=1.13,<2" \
            "numpy>=1.26,<3"

      - name: Generate MMS Tagalog samples
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python tools/voice/mms_tagalog_benchmark.py

      - name: Show benchmark metadata
        run: cat voice-benchmark-mms-tagalog/benchmark.json

      - name: Upload listening benchmark
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: aurum-mms-tagalog-${{ github.run_number }}
          path: voice-benchmark-mms-tagalog/
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        run: |
          {
            echo "## Aurum MMS Tagalog listening benchmark"
            echo "Model: \`facebook/mms-tts-tgl\`"
            echo "License: CC-BY-NC-4.0; personal non-commercial research only."
            echo "Artifact: \`aurum-mms-tagalog-${{ github.run_number }}\`"
            echo "Artifact URL: ${{ steps.upload.outputs.artifact-url }}"
            echo ""
            echo "Download the artifact and listen to Filipino, Taglish, casual, and English WAV samples before any production integration decision."
          } >> "$GITHUB_STEP_SUMMARY"
